<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="contra_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140608"/>
      <stop offset="40%" stop-color="#2D0B12"/>
      <stop offset="100%" stop-color="#4B121C"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5A36"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <filter id="glow_contra" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="600" height="340" fill="url(#contra_bg)"/>
  <!-- 3D Perspective Road Track -->
  <polygon points="300,100 480,260 120,260" fill="#1A0D11" stroke="#FF5A36" stroke-width="2"/>
  <line x1="300" y1="100" x2="300" y2="260" stroke="#FFC857" stroke-width="2" stroke-dasharray="10,8"/>
  <line x1="300" y1="100" x2="210" y2="260" stroke="#FF5A36" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.6"/>
  <line x1="300" y1="100" x2="390" y2="260" stroke="#FF5A36" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.6"/>
  <!-- Obstacles on track -->
  <rect x="260" y="170" width="40" height="18" rx="3" fill="#EF4444" stroke="#FFE4E6" stroke-width="1.5" filter="url(#glow_contra)"/>
  <rect x="330" y="210" width="55" height="24" rx="4" fill="#F59E0B" stroke="#FFE4E6" stroke-width="1.5" filter="url(#glow_contra)"/>
  <!-- Runner avatar shape -->
  <circle cx="270" cy="235" r="14" fill="#38BDF8"/>
  <rect x="262" y="245" width="16" height="20" rx="3" fill="#0284C7"/>
  <!-- Laser projectiles -->
  <line x1="285" y1="235" x2="420" y2="190" stroke="#38BDF8" stroke-width="3" filter="url(#glow_contra)"/>
  <line x1="285" y1="240" x2="360" y2="215" stroke="#FFE600" stroke-width="2" filter="url(#glow_contra)"/>
  <!-- Neon Arcade Header -->
  <text x="300" y="70" font-family="'Press Start 2P', monospace" font-size="20" font-weight="700" fill="#FF5A36" text-anchor="middle" filter="url(#glow_contra)">CONTRA RUN 2.5D</text>
  <text x="300" y="300" font-family="'Oxanium', sans-serif" font-size="16" font-weight="700" fill="#F3F4F6" text-anchor="middle" letter-spacing="4">FAST-PACED ARCADE RUNNER</text>
  <text x="300" y="320" font-family="'Oxanium', sans-serif" font-size="11" font-weight="600" fill="#FFC857" text-anchor="middle" letter-spacing="2">THREE.JS 2.5D • LOCAL ZERO DEPENDENCY</text>
</svg>
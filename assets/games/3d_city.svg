<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="city_sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050B14"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <filter id="city_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="600" height="340" fill="url(#city_sky)"/>
  <!-- Isometric Road Grid -->
  <g stroke="#38BDF8" stroke-width="1.5" opacity="0.3">
    <line x1="100" y1="260" x2="500" y2="140"/>
    <line x1="150" y1="280" x2="550" y2="160"/>
    <line x1="200" y1="140" x2="400" y2="280"/>
    <line x1="280" y1="120" x2="480" y2="260"/>
  </g>
  <!-- Cyber Skyscrapers Isometric -->
  <!-- Tower 1 (Tall Center) -->
  <g transform="translate(300, 160)">
    <polygon points="0,-120 40,-100 0,-80 -40,-100" fill="#38BDF8"/>
    <polygon points="-40,-100 0,-80 0,20 -40,0" fill="#0284C7"/>
    <polygon points="0,-80 40,-100 40,0 0,20" fill="#0369A1"/>
    <!-- Windows glowing -->
    <g fill="#FDE047" opacity="0.8">
      <rect x="-30" y="-70" width="8" height="12"/>
      <rect x="-15" y="-70" width="8" height="12"/>
      <rect x="-30" y="-45" width="8" height="12"/>
      <rect x="-15" y="-45" width="8" height="12"/>
      <rect x="10" y="-65" width="8" height="12"/>
      <rect x="25" y="-65" width="8" height="12"/>
      <rect x="10" y="-40" width="8" height="12"/>
      <rect x="25" y="-40" width="8" height="12"/>
    </g>
  </g>
  <!-- Tower 2 (Left) -->
  <g transform="translate(210, 190)">
    <polygon points="0,-80 35,-65 0,-50 -35,-65" fill="#818CF8"/>
    <polygon points="-35,-65 0,-50 0,20 -35,5" fill="#4F46E5"/>
    <polygon points="0,-50 35,-65 35,5 0,20" fill="#3730A3"/>
  </g>
  <!-- Tower 3 (Right) -->
  <g transform="translate(390, 190)">
    <polygon points="0,-90 35,-75 0,-60 -35,-75" fill="#A78BFA"/>
    <polygon points="-35,-75 0,-60 0,20 -35,5" fill="#7C3AED"/>
    <polygon points="0,-60 35,-75 35,5 0,20" fill="#5B21B6"/>
  </g>
  <!-- Traffic light beam trails -->
  <path d="M 120 250 L 320 180 L 480 230" stroke="#F43F5E" stroke-width="2" fill="none" filter="url(#city_glow)"/>
  <path d="M 160 265 L 360 195 L 520 245" stroke="#FBBF24" stroke-width="2" fill="none" filter="url(#city_glow)"/>
  <!-- Label -->
  <text x="300" y="295" font-family="'Oxanium', sans-serif" font-size="16" font-weight="700" fill="#F3F4F6" text-anchor="middle" letter-spacing="4">3D.CITY BUILDER SIMULATION</text>
  <text x="300" y="318" font-family="'Oxanium', sans-serif" font-size="11" font-weight="600" fill="#38BDF8" text-anchor="middle" letter-spacing="2">REALTIME PROCEDURAL METROPOLIS</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="plat_bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#042F2E"/>
      <stop offset="60%" stop-color="#115E59"/>
      <stop offset="100%" stop-color="#134E4A"/>
    </linearGradient>
    <filter id="plat_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="600" height="340" fill="url(#plat_bg)"/>
  <!-- Floating Platforms -->
  <rect x="80" y="220" width="160" height="20" rx="4" fill="#0D9488" stroke="#14B8A6" stroke-width="2"/>
  <rect x="360" y="220" width="160" height="20" rx="4" fill="#0D9488" stroke="#14B8A6" stroke-width="2"/>
  <rect x="220" y="150" width="160" height="20" rx="4" fill="#0D9488" stroke="#14B8A6" stroke-width="2"/>
  <!-- Collectible Gems -->
  <polygon points="300,105 315,120 300,135 285,120" fill="#FDE047" stroke="#FFE600" stroke-width="2" filter="url(#plat_glow)"/>
  <polygon points="160,175 175,190 160,205 145,190" fill="#38BDF8" stroke="#7DD3FC" stroke-width="2" filter="url(#plat_glow)"/>
  <polygon points="440,175 455,190 440,205 425,190" fill="#F43F5E" stroke="#FDA4AF" stroke-width="2" filter="url(#plat_glow)"/>
  <!-- Dino Character -->
  <g transform="translate(245, 120)">
    <rect x="0" y="0" width="24" height="24" rx="4" fill="#10B981"/>
    <rect x="14" y="4" width="4" height="4" fill="#000000"/>
    <rect x="4" y="24" width="5" height="6" fill="#065F46"/>
    <rect x="15" y="24" width="5" height="6" fill="#065F46"/>
    <polygon points="-6,10 0,6 0,16" fill="#10B981"/>
  </g>
  <!-- Flag Goal -->
  <line x1="490" y1="220" x2="490" y2="150" stroke="#E2E8F0" stroke-width="3"/>
  <polygon points="490,150 455,165 490,180" fill="#EF4444"/>
  <!-- Label -->
  <text x="300" y="295" font-family="'Oxanium', sans-serif" font-size="16" font-weight="700" fill="#F3F4F6" text-anchor="middle" letter-spacing="4">DINO'S ADVENTURE 2D</text>
  <text x="300" y="318" font-family="'Oxanium', sans-serif" font-size="11" font-weight="600" fill="#34D399" text-anchor="middle" letter-spacing="2">CLASSIC 2D PHYSICS PLATFORMER</text>
</svg>
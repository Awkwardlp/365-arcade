<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 338" width="100%" height="100%">
  <rect width="600" height="338" fill="#0f0f12"/>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#2b2c32" stroke-width="0.75"/>
    </pattern>
  </defs>
  <rect width="600" height="338" fill="url(#grid)" opacity="0.6"/>
  <rect x="12" y="12" width="576" height="314" rx="6" fill="none" stroke="#2b2c32" stroke-width="1"/>
  <path d="M 20 32 L 20 20 L 32 20 M 580 32 L 580 20 L 568 20 M 20 306 L 20 318 L 32 318 M 580 306 L 580 318 L 568 318" fill="none" stroke="#00e5ff" stroke-width="2"/>
  
  <text x="36" y="44" fill="#00e5ff" font-family="Montserrat, Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="2">SYS.TARGET // RETICLE_02</text>
  <text x="564" y="44" text-anchor="end" fill="#8d8f97" font-family="Montserrat, Inter, sans-serif" font-size="10" font-weight="600" letter-spacing="1">SUB-PIXEL PRECISION</text>
  
  <!-- Outer Crosshair Arc -->
  <circle cx="300" cy="165" r="90" fill="none" stroke="#2b2c32" stroke-width="1"/>
  <circle cx="300" cy="165" r="70" fill="rgba(0, 229, 255, 0.04)" stroke="#2b2c32" stroke-width="1.5"/>
  <circle cx="300" cy="165" r="50" fill="none" stroke="rgba(0, 229, 255, 0.3)" stroke-width="1" stroke-dasharray="5 5"/>
  <circle cx="300" cy="165" r="30" fill="rgba(0, 229, 255, 0.12)" stroke="#00d9f5" stroke-width="1.5"/>
  <circle cx="300" cy="165" r="6" fill="#00e5ff"/>

  <!-- Crosshair Reticle lines -->
  <line x1="300" y1="55" x2="300" y2="125" stroke="#00e5ff" stroke-width="1.5"/>
  <line x1="300" y1="205" x2="300" y2="275" stroke="#00e5ff" stroke-width="1.5"/>
  <line x1="190" y1="165" x2="260" y2="165" stroke="#00e5ff" stroke-width="1.5"/>
  <line x1="340" y1="165" x2="410" y2="165" stroke="#00e5ff" stroke-width="1.5"/>

  <!-- Target Ticks -->
  <circle cx="180" cy="100" r="14" fill="#17181c" stroke="#2b2c32" stroke-width="1"/>
  <circle cx="180" cy="100" r="4" fill="rgba(0, 229, 255, 0.4)"/>
  
  <circle cx="430" cy="230" r="14" fill="#17181c" stroke="#2b2c32" stroke-width="1"/>
  <circle cx="430" cy="230" r="4" fill="rgba(0, 229, 255, 0.4)"/>

  <rect x="230" y="295" width="140" height="20" rx="3" fill="#17181c" stroke="#2b2c32"/>
  <text x="300" y="309" text-anchor="middle" fill="#00e5ff" font-family="Montserrat, Inter, sans-serif" font-size="9" font-weight="700" letter-spacing="1.5">ACCURACY CALIBRATION</text>
</svg>
